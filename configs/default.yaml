# weft 預設設定。所有值都與 src/weft/config.py 的 default 相同——
# 這個檔案存在是為了讓可調參數一目了然，不是為了覆寫。
#
# 注意：SDD §5.2 的**驗收門檻不在這裡**，也不能放進來。
# 門檻寫死在 src/weft/validation/thresholds.py（§5.5 #7）。

work_dir: work
out_dir: out
log_level: INFO

# S0 取得（§4.1）
s0:
  video_format: "bestvideo[height<=1080]+bestaudio/best[height<=1080]"
  caption_langs: ["zh-TW", "zh-Hant", "zh", "zh-CN"]
  prefer_manual_caption: true
  write_auto_caption: true
  rate_limit: null

# S1a 逐字稿（§4.2）
s1a:
  whisper_model: large-v3
  device: cuda
  compute_type: float16
  language: zh
  beam_size: 5
  vad_filter: true

# S1b 投影片候選幀（§4.3）
s1b:
  fps: 1.0
  # 降解析度 + 模糊，壓制雷射筆紅點與壓縮雜訊（對抗樣本 A4）
  downscale_short_side: 180
  blur_sigma: 2.0
  # HMM：以「投影片會停留一段時間」為先驗，避免手調門檻
  hmm_self_transition: 0.97
  # 「同一頁」基線離散度的下限，作用在尺度無關的 ink Jaccard 上。
  # 沒有它，完全沒換頁的影片（A4）會把量化雜訊當成離群值。見 decisions.md D7。
  min_ink_change: 0.01
  min_slide_duration_sec: 3.0
  # 逐條動畫合併（對抗樣本 A2，門檻 1.00）。0.70 取自實測分離區間：
  # build 的 containment 0.86–0.98，真正換頁 ≤0.56。見 decisions.md D8。
  progressive_merge: true
  progressive_containment_ratio: 0.70

# S3 對齊（§4.6）。這一步不呼叫 LLM。
# v0.3 只做粗切——語意吸附需要投影片文字，而 v0.3 移除了本地 OCR，
# 投影片文字要到 S4 才有。見 known-risks R10。
s3:
  min_segment_sec: 5.0

# S4a 投影片理解（§4.7a，v0.4）。逐張相異投影片一次呼叫，不批次。
# 模型規格是 `供應者:模型名`——供應者必須明寫（§5.5 #6）。
#   gemini:gemini-3.1-flash-lite   花額度
#   ollama:qwen2.5vl:7b            不花額度，R21 實測轉錄最準（跨集 CER 4.9%）
#   ollama:gemma4:12b              不花額度，R21 實測分類最準（is_slide 95%）
# prompt_version v5：判準改為「有沒有這一集特有的講解內容」（R26）
s4a:
  model: gemini:gemini-3.1-flash-lite
  prompt_version: v5
  max_retries: 2
  retry_backoff_sec: 4.0
  # 跨集重現前濾（R26）：在別集也一樣出現過的畫面直接判為節目包裝。
  # 零誤殺，但需要同系列其他集也處理過；參考集不足時會明說並跳過。
  cross_episode_filter: true
  cross_episode_mae: 6.0

# S4c 逐段理解（§4.7c）。
s4:
  model: gemini:gemini-3.1-flash-lite
  # v0.4 預設不送圖——投影片文字已由 S4a 讀出並以文字掛進 prompt
  send_images: false
  # v6：改寫 provenance_kind 的說明（R27：15/27 未通過是來源標錯）。
  # v8 試過「加涵蓋度規定」，**實測是淨損失，已退回**（R43）：
  #     cxrqHABhWOU 每千字產出 464.6 → 233.3（三次重跑確認不是雜訊），
  #     2FjApOVIbUs 持平，UiKi5-Arce4 +4.6%。模型改成寫更多、更短的
  #     block，與意圖相反。**不要再試同一種措辭。**
  # **改 prompt 必改此值**，否則舊快取會被當成新結果（D30）。
  prompt_version: v7
  batch_segments: 3
  prev_summary_max_chars: 200
  max_retries: 2
  retry_backoff_sec: 4.0
  # §5.5 #6：額度耗盡時不得靜默改用本地模型。
  # 本地 fallback 必須是明確開關，且輸出須標記 model_used。
  allow_local_fallback: false
  local_fallback_model: Qwen/Qwen3-VL-8B-Instruct

s5:
  model: gemini:gemini-3.1-flash-lite
  prompt_version: v1

# S6 渲染（§4.9）
s6:
  max_chunk_chars: 800
  write_debug_markdown: true

# 額度（§6.1、§6.2）
quota:
  # 主動節流水位。超過即停止本日處理，不靠撞 429（§5.5 #13）。
  safety_ratio: 0.9
  # 初始猜測值，不是事實——ledger 會從 429 回應學到真實配額並覆蓋它。
  # SDD §6.5 原本寫 1000，實測 flash-lite free tier 是 20（差 50 倍）。
  requests_per_day: 20
  # RPD 於太平洋時間午夜重置。用 zoneinfo 計算，不寫死時差。
  reset_timezone: America/Los_Angeles

# 溯源檢查（§5.4）。這些是「檢查怎麼跑」的參數，
# 不是驗收門檻——通過率 ≥ 0.95 在 thresholds.py。
provenance:
  # bigram containment 門檻。0.25 取自實測分離區間，見 docs/decisions.md D1。
  min_similarity: 0.25
  # 逐 content_type 的正向門檻。R12 校準實測分離度：經文原文 7.50x（有鑑別力）、
  # 白話解說 1.14x、口頭延伸 0.54x、圖表描述 0.00x。對後三型任何門檻都不是
  # 擋掉忠實內容就是放行幻覺，所以只擋退化情形，防幻覺交給具名實體檢查與
  # §5.6 人工抽檢。**這是實質的保護弱化，見 known-risks R12。**
  # 經文原文是唯一能分辨「忠實 vs 部分編造」的型別（分離 7.50x）。
  # 後三型分不出來（分布重疊），但仍分得出「引錯來源」——所以留低下限。
  # 圖表描述無法設任何下限：跨語言時忠實者本身就是 0.000。
  min_similarity_by_type:
    經文原文: 0.60
    白話解說: 0.10
    口頭延伸: 0.05
    圖表描述: 0.0
  # 來源長度 ÷ block 長度的下限。containment 停用後唯一還抓得到東西的正向
  # 檢查。**未經校準**——觀測到的失敗案例只有 1 個（比值 0.11），
  # 次低的忠實樣本是 0.28。
  min_source_ratio: 0.15
  # 反向檢查：逐字複製率（LCS 比率）
  copy_similarity: 0.98
  # 各型別允許的高複製率 block 比例上限。經文原文本來就該是引文。
  max_copy_ratio:
    經文原文: 1.0
    圖表描述: 0.5
    白話解說: 0.8
    口頭延伸: 0.8
  check_named_entities: true
