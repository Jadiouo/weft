[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weft"
version = "0.1.0"
description = "講經影片 → 向量知識庫 pipeline（見 SDD.md）"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pillow>=10.0",
    # v0.3 移除了人臉偵測與 PaddleOCR，鎖 <5 的兩個理由都消失了。
    # 仍保留上限是因為尚未在 5.x 上實測 S1b；放寬前請先跑 A1–A7。
    "opencv-python-headless>=4.10,<5",
    # R13：只用於**驗證** VLM 回傳的術語校正是否真的同音／近音，
    # 不用於產生校正。與 v0.2 被移除的那套「詞庫 → 拼音 → 比對」的
    # 生成鏈是兩回事，見 docs/decisions.md D19。
    "pypinyin>=0.51",
    # R18：把 ASR 輸出的簡體轉成繁體。實測值 5.6 個百分點的溯源通過率，
    # 見 experiments/r18_whisper_impact/REPORT.md 與 docs/decisions.md D24。
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
# v0.3 移除了 PaddleOCR（本地 OCR）、jieba/pypinyin/zhconv（詞庫與術語校正）、
# sentence-transformers（S3 語意吸附）。這些職責改由 S4 的 VLM 承擔。
# **不要為了「備用」把 paddleocr 加回來**——留著就會有人去修它。
gpu = [
    "faster-whisper>=1.0",
]
dev = ["pytest>=8.0", "rich>=13.0"]

[project.scripts]
weft = "weft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# **預設就是離線安全的。** `pytest tests/ -q` 不得需要網路、雲端額度或
# 本地模型服務——擱置數週後回到這個 repo，「現在還是好的嗎」必須用一個
# 指令在幾十秒內答得出來（SPEC v0.5 票 02）。
# 要跑需要外部資源的那一層：`pytest -m live`（CLI 的 -m 會蓋掉這裡的）。
addopts = "-ra --strict-markers -m 'not live and not quota and not gpu'"
markers = [
    # SDD §5.5 #10：e2e 不得用 mock 取代真實模型呼叫；單元測試可 mock，
    # 但檔名須含 `_unit_`。這個規範由 test_unit_conventions.py 強制執行。
    "e2e: 端到端測試，實際跑通完整階段，不得 mock 模型",
    "synth: 需要合成測試影片（首次執行會用 ffmpeg 產生，約 1 分鐘）",
    "gpu: 需要 CUDA 與 pipe-gpu 環境",
    "quota: 會消耗 Gemini API 額度",
    "golden: 需要真實影片黃金集（SDD §5.1 B）",
    # 需要外部資源（下載影片、本地 ollama 服務）。**預設不跑。**
    # 與 `quota` 的差別：quota 是「會花掉雲端額度」，live 是「需要網路或
    # 模型服務」。FROZEN F1 之後雲端不啟用，但 live 這一層仍然存在。
    "live: 需要網路下載與本地模型服務，預設不跑（見 CLAUDE.md）",
]
